on:
  push:
    branches: main
  pull_request:
  merge_group:

name: ci

jobs:
  ci:
    uses: BristolMyersSquibb/blockr.ci/.github/workflows/ci.yaml@v0.1.1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      BLOCKR_PAT: ${{ secrets.BLOCKR_PAT }}

  # Type-check the hand-written JS in inst/js (tsconfig.json; opt-in
  # per file via // @ts-check). No build step, checking only.
  typecheck-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx -y -p typescript@~6.0.0 tsc
